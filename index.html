<style>
:root{
  --bg:#f5f3ee; --card:#fff; --fg:#1d1c19; --muted:#77736a; --line:#e4e0d6; --accent:#22321a; --accent-fg:#f4f1e6; --warn:#b4452c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#10150d; --card:#192114; --fg:#eeece6; --muted:#98958b; --line:#2a3624; --accent:#75c37b; --accent-fg:#14210f; --warn:#e07a60; }
}
:root[data-theme="dark"]{ --bg:#10150d; --card:#192114; --fg:#eeece6; --muted:#98958b; --line:#2a3624; --accent:#75c37b; --accent-fg:#14210f; --warn:#e07a60; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:26px;margin:8px 0 2px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.chip b{margin-right:4px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:8px 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.name{font-size:18px;font-weight:700}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.stage{display:inline-block;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.task input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.task.done span{color:var(--muted);text-decoration:line-through}
.task small{color:var(--muted);font-size:11px;margin-left:auto}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input[type=text],input[type=date],input[type=number],select{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin:4px 0 10px}
label{font-size:13px;color:var(--muted)}
.hv{display:flex;gap:8px;align-items:center;margin-top:12px}
.hv input{margin:0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
h2{font-size:15px;color:var(--muted);margin:22px 0 0;text-transform:uppercase;letter-spacing:.05em}
.chip{cursor:pointer}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{border-left:6px solid var(--c,var(--line))}
.task input:disabled+span{opacity:.4}
.hd{cursor:pointer}.row2{display:flex;gap:8px;align-items:center}
input[type=color]{width:38px;height:38px;padding:0;border:0;background:none;margin:0 0 0 auto}
textarea{font:12px ui-monospace,Menlo,monospace;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin:10px 0 0}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px}
.tab{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:9px;font-weight:600;font-size:15px}
.tab.on{background:var(--accent);color:var(--accent-fg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:21px;color:var(--fg);margin-bottom:2px}
.kpi.wide{grid-column:span 2}
.br{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:14px}.br span{width:92px}.br i{height:10px;background:var(--accent);border-radius:5px;display:block;min-width:3px}.br em{font-style:normal;color:var(--muted);margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.logo{display:flex;align-items:center;gap:12px;margin:8px 0 10px}
.lt{font:700 30px/1 Georgia,'Times New Roman',serif}

body.appin .logo,body.appin .sub,body.appin #pg-d,body.appin #pg-b{animation:appin .75s cubic-bezier(.2,.7,.2,1) both}
